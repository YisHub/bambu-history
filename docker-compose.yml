services:
  bambu-history:
    build: .
    env_file: .env
    container_name: bambu-history
    # A proposito NO va en la red del host y NO publica puertos: asi el visor
    # no escucha en la LAN ni en Tailscale. La unica puerta es Cosmos, que
    # resuelve el nombre del contenedor via Docker y exige login.
    #
    # Si NO tenes un proxy asi y querias entrar por IP, descomenta esto (y mira
    # la advertencia del README: el visor no pide ninguna credencial).
    #ports:
    #  - "${VIEWER_PORT:-8766}:${VIEWER_PORT:-8766}"
    environment:
      # SERVE=1 → modo live (bambu-history actúa como servidor HTTP y
      # regenera on-demand). En este modo NO levantes también `viewer`,
      # porque comparten el puerto 8766.
      SERVE: ${SERVE:-0}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-0}
      # El puerto es de cada máquina: si el default está ocupado, ponés
      # VIEWER_PORT en tu .env y listo. (Acá el 8765 lo usa pc-agent.)
      VIEWER_PORT: ${VIEWER_PORT:-8766}
      # Para que el log muestre el dominio y no la IP interna de Docker
      PUBLIC_URL: ${PUBLIC_URL:-}
    # Que quede levantado solo: arranca con el daemon de Docker (y por lo tanto
    # al bootear) y se repone si se cae. Solo tiene sentido con SERVE=1.
    restart: unless-stopped
    volumes:
      - ./output:/output
      - ./data:/data

  viewer:
    image: python:3.12-alpine
    working_dir: /output
    volumes:
      - ./output:/output:ro
    environment:
      VIEWER_TIMEOUT: ${VIEWER_TIMEOUT:-30m}
      VIEWER_PORT: ${VIEWER_PORT:-8766}
    # VIEWER_TIMEOUT=0 → sin auto-apagado (queda hasta `docker compose down`)
    # cualquier otro valor → formato de `timeout` (ej. 30m, 2h, 90s)
    # Mismo endurecimiento que el modo SERVE=1: `python -m http.server` pelado
    # servia el listado del directorio Y los dotfiles, o sea historial.json,
    # covers/ y cualquier .bambu_token que haya quedado en output/.
    command:
      - sh
      - -c
      - |
        cat > /tmp/serve.py <<'PY'
        import os
        from http.server import HTTPServer, SimpleHTTPRequestHandler
        from urllib.parse import unquote

        class H(SimpleHTTPRequestHandler):
            def ruta(self):
                return unquote(self.path.split('?', 1)[0].split('#', 1)[0])

            def send_head(self):
                r = self.ruta()
                if any(p.startswith('.') for p in r.split('/') if p):
                    self.send_error(403)
                    return None
                if r == '/':
                    self.path = '/historial.html'
                return super().send_head()

            def list_directory(self, path):
                self.send_error(403)
                return None

        HTTPServer(('', int(os.environ.get('VIEWER_PORT', '8766'))), H).serve_forever()
        PY
        if [ "$$VIEWER_TIMEOUT" = "0" ]; then
          exec python /tmp/serve.py
        else
          exec timeout "$$VIEWER_TIMEOUT" python /tmp/serve.py
        fi
    # Solo localhost por defecto: el visor no pide ninguna credencial. Para
    # abrirlo a la LAN, BIND_ADDR=0.0.0.0 en el .env (sabiendo lo que implica).
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VIEWER_PORT:-8766}:${VIEWER_PORT:-8766}"
    restart: "no"
